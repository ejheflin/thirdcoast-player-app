<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schedule — Third Coast Intel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="icon" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3CVB">
<meta name="theme-color" content="#101A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar"><div><div class="greet" id="greet"></div><div class="brand">Full <em style="color:var(--app-win)">Schedule</em></div></div></div>
  <div class="body" id="body">
    <p style="color:var(--app-faint);font-size:13px">Loading…</p>
  </div>
  <div class="tabbar">
    <div class="tab" data-tab="home" aria-label="Home" title="Home"><div class="dot"><svg class="icon"><use href="#i-home"/></svg></div></div>
    <div class="tab" data-tab="court" aria-label="Court" title="Court"><div class="dot"><svg class="icon"><use href="#i-court"/></svg></div></div>
    <div class="tab" data-tab="ranks" aria-label="Ranks" title="Ranks"><div class="dot"><svg class="icon"><use href="#i-bars"/></svg></div></div>
    <div class="tab" data-tab="schedule" aria-label="Schedule" title="Schedule"><div class="dot"><svg class="icon"><use href="#i-calendar"/></svg></div></div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
const programId = new URLSearchParams(location.search).get('program');
wireTabs({ active: 'schedule', programId });

// COURT, courtNumberOf and shortTime used to be duplicated here verbatim
// from gamenight.html, on the grounds that there was no way to share a
// module across pages without a build step. There is: app.js, which
// every page already loads. All three moved there when court.html became
// the third page needing them, and a duplicate `const COURT` here would
// now be a redeclaration that kills this whole script.

// Day-only label for a SECTION HEADER (one per date, not per row --
// gamenight.html's whenBadge() combines day+time into one per-row corner
// tag, which is the wrong shape here since several games can share one
// date). 'long' weekday/month, not gamenight's compact 'short' form --
// this is a full page with room to spare, not a 294px card.
function dayLabel(dateISO) {
  const [y, m, d] = String(dateISO).split('-').map(Number);
  const game = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((game - today) / 86400000);
  if (days === 0) return 'Today';
  if (days > 0 && days < 7) return game.toLocaleDateString(undefined, { weekday: 'long' });
  return game.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
}

// The feed's absolute URL. Derived from location rather than hardcoded to
// the Pages domain so the same code works under
// archive/_serve-repo-root.js in local development -- and so a fork
// serves its own feeds rather than this repo's.
function feedURL(userId, scheme) {
  const dir = location.pathname.replace(/[^/]*$/, '');
  return `${scheme}//${location.host}${dir}data/ics/person-${encodeURIComponent(userId)}.ics`;
}

// Identity is optional and declining it is final, so this screen has to
// handle a saved player with no userId at all. They get no feed -- feeds
// are per-person, and a team-keyed fallback is the exact design the
// feature rejects, since it would die every season. What they get is a
// quiet way in, which does nothing unless they tap it: no re-prompt, no
// nag, the promise that "no" is final stays kept.
function calendarHTML() {
  const me = getMyIdentity();
  if (!me) {
    return '<p class="cal-hint">Add to calendar — '
      + '<a id="calIdentify" href="search.html?identify=1">we need to know which player you are →</a></p>';
  }
  return '<button class="cal-btn" id="addCal">'
    + '<svg class="icon"><use href="#i-calendar"/></svg> Add to calendar</button>';
}

// Built only once the button is tapped, not up front and merely hidden:
// the two feed links do not exist in the DOM at all until the player
// asks for them.
function calendarActionsHTML(me) {
  return `
    <div class="card" id="calActions" style="padding:2px 12px">
      <a class="cal-act" id="calSubscribe" href="${escapeHTML(feedURL(me.userId, 'webcal:'))}">
        <b>Subscribe</b><span>Stays up to date on its own, including next season.</span>
      </a>
      <a class="cal-act" id="calDownload" download href="${escapeHTML(feedURL(me.userId, location.protocol))}">
        <b>Download .ics</b><span>A one-time copy — it won't follow later changes.</span>
      </a>
    </div>`;
}

async function main() {
  const bodyEl = document.getElementById('body');
  const myTeams = getMyTeams();
  if (myTeams.length === 0) {
    bodyEl.innerHTML = '<p style="color:var(--app-faint);font-size:13px">We can\'t find a saved team — <a href="search.html" style="color:var(--app-data)">search again</a>.</p>';
    return;
  }

  // One league is the overwhelmingly common case, and it must render
  // exactly as it always has -- no league labels, same markup. Every
  // multi-league branch below is gated on this.
  const multi = myTeams.length > 1;

  // One fetch pair per LEAGUE, not per team: a player is on one team per
  // program, but asking by team would double-fetch if that ever changed.
  const programIds = [...new Set(myTeams.map((t) => t.programId))];
  const fetched = await Promise.all(programIds.map(async (pid) => {
    const [schedule, standings] = await Promise.all([
      fetchJSON(`data/schedule/${pid}.json`),
      fetchJSON(`data/standings/${pid}.json`),
    ]);
    return { programId: pid, schedule, standings };
  }));
  const byProgram = new Map(fetched.map((f) => [f.programId, f]));

  // The greeting names the player when the app knows them, and otherwise
  // keeps naming the league exactly as before.
  // getMyTeam(), not myTeams[0]: deriveTeamsFor sorts by programId, so the
  // first element of the array is NOT necessarily the player's primary
  // league. The greeting and the playoff marker below both follow the
  // primary.
  const me = getMyIdentity();
  const primaryTeam = getMyTeam() ?? myTeams[0];
  const primary = byProgram.get(primaryTeam.programId);
  document.getElementById('greet').textContent = multi && me
    ? me.firstName
    : (primary?.standings?.programName ?? primaryTeam.programName ?? '');

  // Every game the player is in, from every league, tagged with which of
  // their teams is playing it and which league it belongs to.
  const myGames = [];
  for (const team of myTeams) {
    const src = byProgram.get(team.programId);
    const teamId = Number(team.teamId);
    for (const g of src?.schedule?.games ?? []) {
      if (!g.teams.some((t) => t.teamId === teamId)) continue;
      myGames.push({ game: g, teamId, programId: team.programId, programName: team.programName, standings: src?.standings });
    }
  }
  myGames.sort((a, b) => (a.game.date + a.game.time).localeCompare(b.game.date + b.game.time));

  if (myGames.length === 0) {
    bodyEl.innerHTML = '<p style="color:var(--app-faint);font-size:13px">No games left on the schedule.</p>';
    return;
  }

  // Grouped by DATE across leagues, not by league then date: the player's
  // week is one week, however many leagues it spans.
  const byDate = [];
  for (const entry of myGames) {
    let group = byDate.find((x) => x.date === entry.game.date);
    if (!group) { group = { date: entry.game.date, entries: [] }; byDate.push(group); }
    group.entries.push(entry);
  }

  const rowsHtml = byDate.map((group) => `
    <div class="sec-lbl">${escapeHTML(dayLabel(group.date))}</div>
    <div class="card" style="padding:2px 8px">
      ${group.entries.map(({ game: g, teamId, programId, programName, standings }) => {
        const opp = g.teams.find((t) => t.teamId !== teamId);
        const oppRow = opp ? standings?.rows?.find((r) => r.teamId === opp.teamId) : null;
        const oppName = opp ? displayTeamName(opp.teamName, { stripCaptain: true }) : 'TBD';
        const oppRecord = oppRow ? `${oppRow.wins}-${oppRow.losses}-${oppRow.ties}` : '';

        const courtNum = courtNumberOf(g.courtName);
        const paint = courtNum === null ? null : COURT[courtNum];
        // An unpainted/unnumbered court still gets a badge, same fallback
        // the match card uses -- a grey "—" beats dropping the game.
        const ct = paint ? paint.hex : 'var(--app-raised)';
        const ctInk = paint ? paint.ink : 'var(--app-ink)';
        const badgeText = courtNum === null ? '—' : String(courtNum);

        // Single league: the flat text node it has always been, so the
        // markup is unchanged. Two leagues: a name over a league label,
        // because .sched-opp is a nowrap ellipsis cell and a fifth
        // sibling column would not survive a phone's width.
        const oppCell = multi
          ? `<div class="sched-opp"><div class="sched-opp-name">${escapeHTML(oppName)}</div><div class="sched-opp-league">${escapeHTML(programName ?? '')}</div></div>`
          : `<div class="sched-opp">${escapeHTML(oppName)}</div>`;

        return `
          <a class="row-link" href="team.html?team=${encodeURIComponent(opp?.teamId ?? '')}&program=${encodeURIComponent(programId)}">
            <div class="sched-row">
              <div class="sched-court-badge${paint?.faint ? ' faint' : ''}" style="--ct:${ct};--ct-ink:${ctInk}" title="${escapeHTML(paint ? paint.name : (g.courtName ?? 'court TBD'))}">${escapeHTML(badgeText)}</div>
              <div class="sched-when">${escapeHTML(shortTime(g.time))}</div>
              ${oppCell}
              <div class="sched-rec">${escapeHTML(oppRecord)}</div>
            </div>
          </a>`;
      }).join('')}
    </div>`).join('');

  // The playoff marker stays per-league, and it follows the player's
  // PRIMARY league specifically, not whichever program happens to be in
  // the URL -- a merged list has no single "current" league to hang a
  // one-off announcement on, so it defaults to the one the player
  // actually calls theirs.
  const marker = (primary?.schedule?.tournaments ?? [])[0];
  const markerHtml = marker
    ? `<div class="sec-lbl">${escapeHTML(dayLabel(marker.date))}</div>
       <div class="card" style="padding:14px 12px;text-align:center">
         <b style="font-family:'Archivo Black',Impact,sans-serif;font-size:16px;letter-spacing:.04em">${escapeHTML(marker.title)}</b>
       </div>`
    : '';

  bodyEl.innerHTML = calendarHTML() + rowsHtml + markerHtml;

  const addCal = document.getElementById('addCal');
  if (addCal) {
    // remove(), not `hidden = true`. The hidden ATTRIBUTE is only
    // display:none by way of the UA stylesheet, and .cal-btn sets its own
    // display:flex -- an author rule, which beats the UA origin outright.
    // So the button stayed fully visible and fully tappable, and every
    // further tap inserted another copy of the actions card. Taking it out
    // of the DOM is also the honest shape: this is a one-way door, and the
    // button has nothing left to do once it has been through it.
    addCal.addEventListener('click', () => {
      addCal.insertAdjacentHTML('afterend', calendarActionsHTML(me));
      addCal.remove();
    });
  }
}

main();
</script>
</body>
</html>
