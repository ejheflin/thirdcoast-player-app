<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home — Third Coast Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar"><div><div class="greet" id="greet"></div><div class="brand">Next <em style="color:var(--app-win)">Game</em></div></div></div>
  <div class="body" id="body">
    <p style="color:var(--app-faint);font-size:13px">Loading…</p>
  </div>
  <div class="tabbar">
    <div class="tab" data-tab="home"><div class="dot"><svg class="icon"><use href="#i-home"/></svg></div>Home</div>
    <div class="tab" data-tab="ranks"><div class="dot"><svg class="icon"><use href="#i-bars"/></svg></div>Ranks</div>
    <div class="tab" data-tab="matchup"><div class="dot"><svg class="icon"><use href="#i-matchup"/></svg></div>Matchup</div>
    <div class="tab" data-tab="players"><div class="dot"><svg class="icon"><use href="#i-person"/></svg></div>Players</div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
// Returning player only: index.html is the "next game" home feed, so
// there's nothing to show without a saved team. search.html owns the
// opposite direction (it no longer redirects a returning player away).
const saved = getMyTeam();
if (!saved) {
  location.href = 'search.html';
} else {
  main(saved);
}

// The venue's real painted courts, copied verbatim from the broadcast
// board's own paint table (the brackets repo's prototype/board-data.js).
// "The pink court" is what players actually say out loud, which is the
// whole argument for colour-coding -- and the whole reason the match card
// carries the paint and not just a number. `faint` marks the three under
// 3:1 against this ground -- black, maroon, dark green -- which get a
// sand ring rather than reading as a notch cut out of the card. Do not
// edit these by eye: the board's prototype/check-contrast.mjs is what
// asserts the flags, so these values have to stay identical to it.
const COURT = {
  1:  {name:"lime green", hex:"#8CC63F", ink:"#0A0A0A"},
  2:  {name:"orange",     hex:"#F2872F", ink:"#0A0A0A"},
  3:  {name:"blue",       hex:"#2F72C4", ink:"#FFFFFF"},
  4:  {name:"maroon",     hex:"#8E2F3F", ink:"#FFFFFF", faint:true},
  5:  {name:"dark green", hex:"#1F6B3A", ink:"#FFFFFF", faint:true},
  6:  {name:"yellow",     hex:"#F2CE2F", ink:"#0A0A0A"},
  7:  {name:"black",      hex:"#151515", ink:"#FFFFFF", faint:true},
  8:  {name:"pink",       hex:"#E86FA8", ink:"#0A0A0A"},
  9:  {name:"purple",     hex:"#8455C4", ink:"#FFFFFF"},
  10: {name:"white",      hex:"#F4F4F2", ink:"#0A0A0A"},
  11: {name:"red",        hex:"#D93A32", ink:"#FFFFFF"},
  12: {name:"tan",        hex:"#C9A87C", ink:"#0A0A0A"},
};

// setDiffFor/ratingFor copied verbatim from matchup.html (also duplicated
// in odds.html) -- this project's established convention, since there's
// no build step to share a module across pages.
function setDiffFor(teamId, games) {
  return games.reduce((sum, g) => {
    const me = g.teams.find((t) => t.teamId === teamId);
    const opp = g.teams.find((t) => t.teamId !== teamId);
    if (!me || !opp) return sum;
    return sum + (me.score - opp.score);
  }, 0);
}

// Only ever called for a team that has actually played: with gamesPlayed
// 0 both terms divide by zero and every number downstream becomes NaN.
function ratingFor(row, games) {
  const winRate = (row.wins + 0.5 * row.ties) / row.gamesPlayed;
  const setDiffPerGame = setDiffFor(row.teamId, games) / row.gamesPlayed;
  return winRate + setDiffPerGame * 0.05;
}

// Splits 100% between two ratings. A rating can legitimately be negative
// (a winless team with a negative average set differential), and a plain
// ratingA/(ratingA+ratingB) breaks on that: dividing by a negative sum
// INVERTS which team reads as the favorite, and a sum of exactly zero
// yields NaN that Math.max/Math.min can't clamp away. Shifting both
// ratings up by the same constant until neither is negative fixes it
// without touching the gap between them -- the relative ordering and the
// size of the difference, which are what should drive the split, are
// preserved exactly. Kept identical to matchup.html's copy.
function splitPct(ratingA, ratingB) {
  const minRating = Math.min(ratingA, ratingB);
  const shift = minRating <= 0 ? -minRating + 0.01 : 0;
  const a = ratingA + shift;
  const b = ratingB + shift;
  let pctA = Math.round((a / (a + b)) * 100);
  pctA = Math.max(1, Math.min(99, pctA));
  return { pctA, pctB: 100 - pctA };
}

// The court number the paint table is keyed by, out of the schedule's
// human court name ("Court 12"). Returns null for anything unnumbered so
// the caller can fall back rather than paint a card off COURT[NaN].
function courtNumberOf(courtName) {
  const m = /(\d+)/.exec(String(courtName ?? ''));
  return m ? Number(m[1]) : null;
}

// "HH:MM" 24-hour, as archive/schedule.js writes it, cut down to what
// fits in the card's corner tag: "6:30p", and "7p" on the hour.
function shortTime(time) {
  const [hh, mm] = String(time).split(':').map(Number);
  if (!Number.isFinite(hh) || !Number.isFinite(mm)) return '';
  const suffix = hh >= 12 ? 'p' : 'a';
  const h12 = ((hh + 11) % 12) + 1;
  return mm === 0 ? `${h12}${suffix}` : `${h12}:${String(mm).padStart(2, '0')}${suffix}`;
}

// The corner tag's text. The board's own tag already showed a bare start
// time for an upcoming game; this extends it with the day, because a
// player looking at their phone on Sunday needs to tell Tuesday from
// tonight. "YYYY-MM-DD" is parsed as local calendar fields, not handed to
// `new Date(str)` -- that parses as UTC midnight and can print the wrong
// weekday/day depending on the viewer's timezone.
function whenBadge(dateISO, time) {
  const [y, m, d] = String(dateISO).split('-').map(Number);
  const game = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((game - today) / 86400000);
  let day;
  if (days === 0) day = 'Today';
  else if (days > 0 && days < 7) day = game.toLocaleDateString(undefined, { weekday: 'short' });
  else day = game.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const t = time ? shortTime(time) : '';
  return t ? `${day} ${t}` : day;
}

// Display-only: strips a trailing "(First L.)" captain-name parenthetical
// from a team name before it renders on the match card -- the full
// roster right below in .mroster already shows and flags the captain,
// so the parenthetical up here is redundant. Same shape as
// archive/leagueapps.js's redactTrailingParenthetical (same trailing-
// paren regex), but REMOVING the group instead of abbreviating it, and
// display-only: docs/data/*.json itself is untouched, and
// archive/leagueapps.js's own redaction (a privacy control with its own
// careful history) is untouched too -- this is cosmetic, not privacy.
// Common, not an edge case: 1647 of 3758 real team names (44%) carry
// this suffix. Guarded against a real teamName that IS just a
// parenthetical ("(Lily P.)", seen in real data) -- stripping
// unconditionally would leave an empty string, worse than the
// "redundant" original, so the strip only applies when non-whitespace
// content survives before it.
function displayTeamName(teamName) {
  const name = String(teamName ?? '');
  const m = /\(([^)]+)\)\s*$/.exec(name);
  if (!m) return name;
  const before = name.slice(0, m.index).trim();
  return before ? before : name;
}

// One roster row, close kin to team.html's own markup (first names only,
// captain flagged, each row a drill-down) but laid out as a 2-column grid
// (Eric: "make the roster font larger and split it into 2 columns") rather
// than team.html's single stacked column -- this function is only ever
// called from THIS file's match card, so restructuring its markup can't
// touch team.html's own, separately-generated roster rows at all.
// The name+captain-tag pair is wrapped in its own .rmeta column: at half
// this card's width, "avatar + name + CAPTAIN badge" no longer fits on
// one line the way it did full-width, so the badge now sits on its own
// line under the name instead of clipping or wrapping mid-badge.
function rosterRowsHTML(roster) {
  const players = roster?.players ?? [];
  if (players.length === 0) {
    return '<p style="color:var(--app-faint);font-size:12px;margin:8px 2px">No roster archived for this team yet.</p>';
  }
  return `<div class="rgrid">${players.map((p) => `
    <a class="row-link" href="player.html?person=${encodeURIComponent(p.userId)}">
      <div class="roster-row">
        <div class="ini">${escapeHTML(String(p.firstName).slice(0, 2).toUpperCase())}</div>
        <div class="rmeta">
          <div class="who">${escapeHTML(p.firstName)}</div>
          ${p.isCaptain ? '<div class="cap">Captain</div>' : ''}
        </div>
      </div>
    </a>`).join('')}</div>`;
}

// Head-to-head history between THIS team and THIS opponent specifically --
// not each team's separate overall season form (that was the wrong read of
// the ask; Eric wants "for A vs B matches, one row of history", i.e. only
// games these two exact teams have played against EACH OTHER). Same filter
// matchup.html already uses to find previous meetings (docs/matchup.html
// ~line 115: both team ids present on the same game), reused verbatim,
// but here it also needs the actual result sequence rather than just
// met.length. Rendered from `teamId`'s (my team's) perspective, same
// result field/letter mapping as team.html's own formDots and the same
// win/loss/tie dot colors -- not the pink/blue "which team" identity
// colors used elsewhere on this card, since there's only one shared row
// now, not one per team. `games` (the full season list) is already
// chronological -- see the archive-order note elsewhere in this file --
// so no re-sort is needed before capping the tail.
function headToHeadHTML(teamId, oppId, games, cap) {
  if (oppId == null) return '<span class="empty">Not yet met this season.</span>';
  const met = games.filter((g) =>
    g.teams.some((t) => t.teamId === teamId) && g.teams.some((t) => t.teamId === oppId));
  if (met.length === 0) return '<span class="empty">Not yet met this season.</span>';
  const dots = met.slice(-cap).map((g) => {
    const me = g.teams.find((t) => t.teamId === teamId);
    const letter = me.result === 'win' ? 'W' : me.result === 'loss' ? 'L' : 'D';
    return `<i class="${letter}"></i>`;
  }).join('');
  return `<span class="fdots">${dots}</span>`;
}

// One game: the ported broadcast match card, its own odds strip, and its
// own opponent roster, as a single attached group.
//
// The one deliberate reinterpretation of the board's card: the board
// shows true home/away, this always puts the PLAYER'S OWN team in the top
// slot. schedule.json's `teams` array carries no home/away flag at all
// (see archive/schedule.js), and a player wants to see themselves first
// regardless -- so the array's own order is not used for anything here.
function gameGroupHTML({ game, teamId, myName, myRecord, standings, games, roster }) {
  const opponent = game.teams.find((t) => t.teamId !== teamId);
  const oppRow = opponent ? standings?.rows?.find((r) => r.teamId === opponent.teamId) : null;
  const oppName = opponent?.teamName ?? 'TBD';
  const oppRecord = oppRow ? `${oppRow.wins}-${oppRow.losses}-${oppRow.ties}` : '';

  const courtNum = courtNumberOf(game.courtName);
  const paint = courtNum === null ? null : COURT[courtNum];
  // A court the paint table doesn't know still gets a card: an unpainted
  // slab is a far smaller failure than dropping the game off the page.
  const ct = paint ? paint.hex : 'var(--app-raised)';
  const ctInk = paint ? paint.ink : 'var(--app-ink)';
  const slabText = courtNum === null ? '—' : String(courtNum);
  const paintName = paint ? paint.name : (game.courtName ? String(game.courtName) : 'court TBD');

  const myRow = standings?.rows?.find((r) => r.teamId === teamId);
  const myRating = myRow && myRow.gamesPlayed > 0 ? ratingFor(myRow, games) : null;
  const oppRating = oppRow && oppRow.gamesPlayed > 0 ? ratingFor(oppRow, games) : null;

  // A round-robin season rarely puts the same two teams on court more than
  // a small handful of times, so 12 (team.html's own cap) is more headroom
  // than this row will realistically ever need -- kept anyway as the same
  // safety cap team.html uses, so an unusually long series still fits one
  // line instead of wrapping.
  const H2H_CAP = 12;
  const form = `
    <div class="mform">
      <span class="flbl">Previous matches</span>
      ${headToHeadHTML(teamId, opponent?.teamId, games, H2H_CAP)}
    </div>`;

  let odds;
  if (myRating === null || oppRating === null) {
    odds = '<div class="h2h-meta">Not enough games played yet for a prediction.</div>';
  } else {
    const { pctA: pctMe, pctB: pctOpp } = splitPct(myRating, oppRating);
    odds = `
      <div class="probbar"><div class="a" style="flex:${pctMe}">${pctMe}%</div><div class="b" style="flex:${pctOpp}">${pctOpp}%</div></div>
      <div class="h2h-meta">Model: season win-rate + set differential per game.</div>`;
  }

  return `
    <div class="mgame" style="--ct:${ct};--ct-ink:${ctInk}">
      <div class="mcard${paint?.faint ? ' faint' : ''}">
        <div class="slab" data-paint="${escapeHTML(paintName)}"><span class="cnum">${escapeHTML(slabText)}</span></div>
        <div class="mbody">
          <div class="teams">
            <div class="side a"><span class="tname">${escapeHTML(displayTeamName(myName))}</span>${myRecord ? `<span class="capn">${myRecord}</span>` : ''}</div>
            <div class="rule"><span class="vs">vs</span></div>
            <div class="side b"><span class="tname">${escapeHTML(displayTeamName(oppName))}</span>${oppRecord ? `<span class="capn">${oppRecord}</span>` : ''}</div>
          </div>
        </div>
        <span class="statetag">${escapeHTML(whenBadge(game.date, game.time))}</span>
      </div>
      ${form}
      <div class="modds">${odds}</div>
      <div class="mroster">
        <div class="rlbl">Opponent roster</div>
        ${rosterRowsHTML(roster)}
      </div>
    </div>`;
}

async function main(saved) {
  const programId = saved.programId;
  const teamId = Number(saved.teamId);
  // Own home feed, so Home is the tab you're on. No personId yet -- like
  // matchup.html/rankings.html/odds.html, wireTabs resolves the captain
  // of the team in context (this team) on its own once the roster loads.
  wireTabs({ active: 'home', programId, teamId });

  const bodyEl = document.getElementById('body');
  const [schedule, standings, activities] = await Promise.all([
    fetchJSON(`data/schedule/${programId}.json`),
    fetchJSON(`data/standings/${programId}.json`),
    fetchJSON(`data/activities/${programId}.json`),
  ]);

  const programName = standings?.programName ?? saved.programName ?? '';
  document.getElementById('greet').textContent = programName;

  const myRow = standings?.rows?.find((r) => r.teamId === teamId);
  const games = activities?.games ?? [];
  const myGames = games.filter((g) => g.teams.some((t) => t.teamId === teamId));

  const seasonStatsLink =
    `<p style="margin-top:18px"><a class="textlink" href="team.html?team=${encodeURIComponent(teamId)}&program=${encodeURIComponent(programId)}">Season stats →</a></p>`;

  // Deliberately minor: search.html is otherwise only reachable via the
  // no-saved-team redirect, so a player whose team situation changed (new
  // season, switched leagues) had no route back to it at all. Rare-use
  // escape hatch, styled to stay well behind the next-game content --
  // faint, small, and last on the page.
  const searchAgainLink =
    '<p style="margin:14px 0 4px"><a id="searchAgain" href="search.html" ' +
    'style="color:var(--app-faint);font-size:11.5px;text-decoration:underline">' +
    'Not your team? Search again</a></p>';

  // A real league night can put one team on court more than once, so this
  // finds the earliest DATE the team appears on and then takes EVERY game
  // it plays on that date -- however many are real, not a hardcoded two.
  // (The array's own natural ascending order already makes the first
  // matching date the earliest, but min-by-date says so explicitly and
  // survives a schedule that ever arrives unsorted.)
  const myUpcoming = (schedule?.games ?? []).filter((g) => g.teams.some((t) => t.teamId === teamId));
  const nextDate = myUpcoming.reduce((earliest, g) => (earliest === null || g.date < earliest ? g.date : earliest), null);
  const nextGames = nextDate === null
    ? []
    : myUpcoming.filter((g) => g.date === nextDate)
      .sort((a, b) => String(a.time ?? '').localeCompare(String(b.time ?? '')));

  if (nextGames.length > 0) {
    // One fetch per game: two games on the same night are normally against
    // two different opponents, so the roster is per-game, not per-page.
    const rosters = await Promise.all(nextGames.map((g) => {
      const opp = g.teams.find((t) => t.teamId !== teamId);
      return opp
        ? fetchJSON(`data/rosters/${encodeURIComponent(programId)}-${encodeURIComponent(opp.teamId)}.json`)
        : Promise.resolve(null);
    }));

    const myName = myRow?.teamName ?? saved.teamName ?? 'Your team';
    const myRecord = myRow ? `${myRow.wins}-${myRow.losses}-${myRow.ties}` : '';

    const label = nextGames.length > 1 ? `Next game night · ${nextGames.length} matches` : 'Next game';
    bodyEl.innerHTML = `
      <div class="sec-lbl" style="margin-top:2px">${label}</div>
      ${nextGames.map((game, i) => gameGroupHTML({
        game, teamId, myName, myRecord, standings, games, roster: rosters[i],
      })).join('')}
      ${seasonStatsLink}
      ${searchAgainLink}
    `;
    return;
  }

  // No upcoming game found for this team -- fall back to the most recent
  // PLAYED game (team.html's own game-log logic, reused) plus the current
  // record/rank, rather than leaving the page blank.
  const lastGame = myGames.at(-1);
  const setDiff = myGames.reduce((sum, g) => {
    const me = g.teams.find((t) => t.teamId === teamId);
    const opp = g.teams.find((t) => t.teamId !== teamId);
    return sum + ((me?.score ?? 0) - (opp?.score ?? 0));
  }, 0);

  if (!myRow && !lastGame) {
    // No standings row AND no archived game: the saved pointer is dead, not
    // merely early-season. (search.html only ever offers teams that HAVE a
    // standings row, so a team the player could have saved always had one.)
    // Same treatment team.html already gives this exact situation: drop the
    // pointer here rather than leaving the player to discover it four hops
    // away behind "Season stats", and offer the way out on this screen.
    const stillSaved = getMyTeam();
    if (stillSaved && String(stillSaved.programId) === String(programId) && String(stillSaved.teamId) === String(teamId)) {
      clearMyTeam();
    }
    bodyEl.innerHTML = `
      <p style="color:var(--app-faint);font-size:13px">We can't find this team anymore —
      <a href="search.html" style="color:var(--app-data)">search again</a>.</p>`;
    return;
  }

  let statGridHtml = '';
  if (myRow) {
    statGridHtml = `
      <div class="stat-grid">
        <div class="box"><b>${myRow.wins}-${myRow.losses}-${myRow.ties}</b><span>Record</span></div>
        <div class="box"><b>${setDiff >= 0 ? '+' : ''}${setDiff}</b><span>Set diff</span></div>
        <div class="box"><b>#${myRow.position}</b><span>Power rank</span></div>
      </div>`;
  }

  let lastGameHtml = '';
  if (lastGame) {
    const me = lastGame.teams.find((t) => t.teamId === teamId);
    const opp = lastGame.teams.find((t) => t.teamId !== teamId);
    const letter = me.result === 'win' ? 'W' : me.result === 'loss' ? 'L' : 'D';
    lastGameHtml = `
      <div class="sec-lbl">Last result</div>
      <div class="card">
        <div class="gamelog-row"><div class="r ${letter}">${letter}</div>
          <div class="opp">${escapeHTML(opp?.teamName ?? 'Unknown')}</div>
          <div class="sc">${me.score}-${opp?.score ?? 0}</div></div>
      </div>`;
  }

  bodyEl.innerHTML = `
    <p style="color:var(--app-faint);font-size:13px;margin:2px 0 16px">No game scheduled right now.</p>
    ${statGridHtml}
    ${lastGameHtml}
    ${seasonStatsLink}
    ${searchAgainLink}
  `;
}
</script>
</body>
</html>
