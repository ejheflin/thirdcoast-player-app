<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home — Third Coast Intel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="icon" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3CVB">
<meta name="theme-color" content="#101A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar"><div><div class="greet" id="greet"></div><div class="brand">Next <em style="color:var(--app-win)">Game</em></div></div></div>
  <div class="body" id="body">
    <p style="color:var(--app-faint);font-size:13px">Loading…</p>
  </div>
  <div class="tabbar">
    <div class="tab" data-tab="home" aria-label="Home" title="Home"><div class="dot"><svg class="icon"><use href="#i-home"/></svg></div></div>
    <div class="tab" data-tab="court" aria-label="Court" title="Court"><div class="dot"><svg class="icon"><use href="#i-court"/></svg></div></div>
    <div class="tab" data-tab="ranks" aria-label="Ranks" title="Ranks"><div class="dot"><svg class="icon"><use href="#i-bars"/></svg></div></div>
    <div class="tab" data-tab="schedule" aria-label="Schedule" title="Schedule"><div class="dot"><svg class="icon"><use href="#i-calendar"/></svg></div></div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
// Returning player only: index.html is the "next game" home feed, so
// there's nothing to show without a saved team. search.html owns the
// opposite direction (it no longer redirects a returning player away).
// index.html routes a player to the league holding their NEXT game, which
// for a two-league player is not necessarily their primary -- and
// everything on this screen that is not the cross-league match merge (the
// tab bar, the stat grid, set diff, "Last result", the Season stats link)
// follows one single league. That league has to be the one whose game is
// on the card, or a player routed into their Thursday league reads their
// Monday record underneath their Thursday game.
//
// Validated against getMyTeams() rather than trusted: a query string is
// typed by anyone, and this screen must never render a team the player is
// not actually on. Anything that does not match falls back to the saved
// primary, which is also what a bare gamenight.html gets.
function routedTeam() {
  const params = new URLSearchParams(location.search);
  const programId = params.get('program');
  const teamId = params.get('team');
  if (programId === null || teamId === null) return null;
  return getMyTeams().find((t) => String(t.programId) === programId
    && String(t.teamId) === teamId) ?? null;
}

const saved = routedTeam() ?? getMyTeam();
if (!saved) {
  location.href = 'search.html';
} else {
  main(saved);
}

async function main(saved) {
  const myTeams = getMyTeams();
  const multi = myTeams.length > 1;
  const programId = saved.programId;
  const teamId = Number(saved.teamId);
  // Own home feed, so Home is the tab you're on -- no other tab applies here.
  wireTabs({ active: 'home', programId, teamId });

  const bodyEl = document.getElementById('body');

  // One fetch trio per league the player is in.
  const programIds = [...new Set(myTeams.map((t) => t.programId))];
  const loaded = new Map(await Promise.all(programIds.map(async (pid) => {
    const [schedule, standings, activities] = await Promise.all([
      fetchJSON(`data/schedule/${pid}.json`),
      fetchJSON(`data/standings/${pid}.json`),
      fetchJSON(`data/activities/${pid}.json`),
    ]);
    return [pid, { schedule, standings, activities }];
  })));

  const mine = loaded.get(programId) ?? { schedule: null, standings: null, activities: null };
  const standings = mine.standings;
  const programName = standings?.programName ?? saved.programName ?? '';

  // The greeting finally names the player, which is what an element called
  // `greet` was always for -- the app has simply never known until now.
  //
  // Only when there is more than one league, matching schedule.html
  // exactly: with a single league the league's own name is still the more
  // useful heading, and a one-league identity player's screen has to stay
  // indistinguishable from the team-only baseline.
  const me = getMyIdentity();
  document.getElementById('greet').textContent = multi && me ? me.firstName : programName;

  const myRow = standings?.rows?.find((r) => r.teamId === teamId);
  const games = mine.activities?.games ?? [];
  const myGames = games.filter((g) => g.teams.some((t) => t.teamId === teamId));

  const seasonStatsLink =
    `<p style="margin-top:18px"><a class="textlink" href="team.html?team=${encodeURIComponent(teamId)}&program=${encodeURIComponent(programId)}">Season stats →</a></p>`;

  // Deliberately minor: search.html is otherwise only reachable via the
  // no-saved-team redirect, so a player whose team situation changed (new
  // season, switched leagues) had no route back to it at all. Rare-use
  // escape hatch, styled to stay well behind the next-game content --
  // faint, small, and last on the page.
  const searchAgainLink =
    '<p style="margin:14px 0 4px"><a id="searchAgain" href="search.html" ' +
    'style="color:var(--app-faint);font-size:11.5px;text-decoration:underline">' +
    'Not your team? Search again</a></p>';

  // A real league night can put one team on court more than once, and a
  // player in two leagues can have a night in either. So: collect every
  // upcoming game across every league, take the earliest DATE among them,
  // and show every game on that date -- from whichever leagues it falls
  // in. Same rule as before, one league wider.
  const upcoming = [];
  for (const team of myTeams) {
    const src = loaded.get(team.programId);
    const tid = Number(team.teamId);
    for (const g of src?.schedule?.games ?? []) {
      if (!g.teams.some((t) => t.teamId === tid)) continue;
      upcoming.push({ game: g, teamId: tid, programId: team.programId, programName: team.programName, standings: src?.standings, games: src?.activities?.games ?? [] });
    }
  }
  const nextDate = upcoming.reduce((earliest, e) => (earliest === null || e.game.date < earliest ? e.game.date : earliest), null);
  const nextEntries = nextDate === null
    ? []
    : upcoming.filter((e) => e.game.date === nextDate)
      .sort((a, b) => String(a.game.time ?? '').localeCompare(String(b.game.time ?? '')));

  if (nextEntries.length > 0) {
    const rosters = await Promise.all(nextEntries.map((e) => {
      const opp = e.game.teams.find((t) => t.teamId !== e.teamId);
      return opp
        ? fetchJSON(`data/rosters/${encodeURIComponent(e.programId)}-${encodeURIComponent(opp.teamId)}.json`)
        : Promise.resolve(null);
    }));

    // Grouped under a per-league .sec-lbl when the player is in more than
    // one, which reuses the section-header idiom every other screen uses
    // rather than threading a league name through matchCardHTML (which
    // court.html also calls).
    const groups = [];
    for (let i = 0; i < nextEntries.length; i++) {
      const e = nextEntries[i];
      let g = groups.find((x) => x.programId === e.programId);
      if (!g) { g = { programId: e.programId, programName: e.programName, items: [] }; groups.push(g); }
      g.items.push({ entry: e, roster: rosters[i] });
    }

    const countLabel = nextEntries.length > 1 ? `Next game night · ${nextEntries.length} matches` : 'Next game';
    bodyEl.innerHTML = `
      <div class="sec-lbl" style="margin-top:2px">${escapeHTML(countLabel)}</div>
      ${groups.map((g) => `
        ${multi ? `<div class="sec-lbl">${escapeHTML(g.programName ?? '')}</div>` : ''}
        ${g.items.map(({ entry, roster }) => matchCardHTML({
          game: entry.game,
          programId: entry.programId,
          standings: entry.standings,
          games: entry.games,
          focusTeamId: entry.teamId,
          rosters: roster ? { [roster.teamId]: roster } : {},
        })).join('')}`).join('')}
      ${seasonStatsLink}
      ${searchAgainLink}
    `;
    return;
  }

  // No upcoming game found for this team -- fall back to the most recent
  // PLAYED game (team.html's own game-log logic, reused) plus the current
  // record/rank, rather than leaving the page blank.
  const lastGame = myGames.at(-1);
  const setDiff = myGames.reduce((sum, g) => {
    const me = g.teams.find((t) => t.teamId === teamId);
    const opp = g.teams.find((t) => t.teamId !== teamId);
    return sum + ((me?.score ?? 0) - (opp?.score ?? 0));
  }, 0);

  if (!myRow && !lastGame) {
    // No standings row AND no archived game: the saved pointer is dead, not
    // merely early-season. (search.html only ever offers teams that HAVE a
    // standings row, so a team the player could have saved always had one.)
    // Same treatment team.html already gives this exact situation: drop the
    // pointer here rather than leaving the player to discover it four hops
    // away behind "Season stats", and offer the way out on this screen.
    // forgetTeam, not clearMyTeam: an identity player's dead team is only
    // one of their leagues (and is usually the primary, which is what the
    // guard above matched), so the userId and any surviving league have to
    // outlive it.
    const stillSaved = getMyTeam();
    if (stillSaved && String(stillSaved.programId) === String(programId) && String(stillSaved.teamId) === String(teamId)) {
      forgetTeam(stillSaved);
    }
    bodyEl.innerHTML = `
      <p style="color:var(--app-faint);font-size:13px">We can't find this team anymore —
      <a href="search.html" style="color:var(--app-data)">search again</a>.</p>`;
    return;
  }

  let statGridHtml = '';
  if (myRow) {
    statGridHtml = `
      <div class="stat-grid">
        <div class="box"><b>${myRow.wins}-${myRow.losses}-${myRow.ties}</b><span>Record</span></div>
        <div class="box"><b>${setDiff >= 0 ? '+' : ''}${setDiff}</b><span>Set diff</span></div>
        <div class="box"><b>#${myRow.position}</b><span>Power rank</span></div>
      </div>`;
  }

  let lastGameHtml = '';
  if (lastGame) {
    const me = lastGame.teams.find((t) => t.teamId === teamId);
    const opp = lastGame.teams.find((t) => t.teamId !== teamId);
    const letter = me.result === 'win' ? 'W' : me.result === 'loss' ? 'L' : 'D';
    lastGameHtml = `
      <div class="sec-lbl">Last result</div>
      <div class="card">
        <div class="gamelog-row"><div class="r ${letter}">${letter}</div>
          <div class="opp">${escapeHTML(displayTeamName(opp?.teamName ?? 'Unknown'))}</div>
          <div class="sc">${me.score}-${opp?.score ?? 0}</div></div>
      </div>`;
  }

  bodyEl.innerHTML = `
    <p style="color:var(--app-faint);font-size:13px;margin:2px 0 16px">No game scheduled right now.</p>
    ${statGridHtml}
    ${lastGameHtml}
    ${seasonStatsLink}
    ${searchAgainLink}
  `;
}
</script>
</body>
</html>
