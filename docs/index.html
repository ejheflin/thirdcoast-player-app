<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Third Coast Intel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="icon" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3CVB">
<meta name="theme-color" content="#101A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<!-- index.html is a ROUTER, not a screen. It owns one decision -- which
     home screen this player should be looking at right now -- and then
     hands off. Nothing here is meant to be read: the markup below is a
     one-frame loading state that only shows if the schedule fetch is
     slow, styled with the same shell as every other page so that frame
     doesn't flash as a bare white document. -->
<div class="screen">
  <div class="body" style="display:grid;place-items:center">
    <p style="color:var(--app-faint);font-size:13px">Loading…</p>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
// The four destinations:
//
//   no saved team          -> search.html   (unchanged: search.html owns
//                             the opposite direction and no longer
//                             redirects a returning player away)
//   saved season is over   -> season.html   (roll the player forward)
//   playoff night next     -> playoffs.html
//   anything else          -> gamenight.html
//
// "Anything else" deliberately includes "nothing scheduled at all":
// gamenight.html already has its own fallback content for that (last
// result + current record, or the stale-pointer recovery when the saved
// team has gone away entirely), so this router must NOT try to
// re-decide that here. Duplicating it would put the stale-pointer
// cleanup in two places, and only one of them would ever be fixed.

// location.replace, not location.href: a router in the history stack is
// a back-button trap -- back from gamenight.html lands on index.html,
// which immediately routes forward to gamenight.html again.
const saved = getMyRecord();
if (!saved) {
  location.replace('search.html');
} else if (saved.userId != null) {
  routeIdentity(saved);
} else if (!identityAsked() && !identityDeclined()) {
  // A player who saved a team before identity existed. Asked exactly once,
  // and only from here -- onboarding asks new players inline, so this
  // branch is purely the migration path.
  //
  // Both flags, because the two ways out of the picker are different
  // facts. "None of these" is an answer and sets the durable declined
  // flag; closing the app at the picker answers nothing, but search.html
  // marks that the ask was MADE as soon as it renders, and a full-screen
  // interstitial on a page with no tab bar does not get to reappear on
  // every visit just because it was walked away from.
  location.replace('search.html?identify=1');
} else {
  route(saved);
}

// Local calendar date, not new Date().toISOString(): that is UTC, and for
// a player on Central time between 7pm and midnight it reads as tomorrow
// -- which would drop tonight's playoff marker off the "upcoming" list on
// the exact evening it matters most.
function todayISO() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// A tournament marker (archive/schedule.js's extractTournamentMarker,
// written into schedule/{programId}.json as `tournaments`) is
// program-wide, not per-team: the real ones carry `teams: []` and a title
// of "PLAYOFFS", and they apply to everyone in the league. So the games
// it is compared against are the program's games, not one team's.
//
// Both lists are re-filtered against today here rather than trusted as
// archived. The archiver only writes future-dated entries, but "future"
// was true at its last run, which can be up to half a day ago -- so a
// game night that has since passed would otherwise still count as the
// next thing on the calendar.
function isPlayoffNight(schedule, today) {
  const tournaments = (schedule?.tournaments ?? []).filter((t) => t.date >= today);
  if (tournaments.length === 0) return false;
  const games = (schedule?.games ?? []).filter((g) => g.date >= today);
  // A marker with no remaining games is unambiguous: the season's
  // regular schedule is done and playoffs are what's left.
  if (games.length === 0) return true;
  const earliest = (list) => list.reduce((min, x) => (x.date < min ? x.date : min), list[0].date);
  // On or before, not strictly before: a real league puts the playoff
  // marker and that night's own games on the SAME date, and on that date
  // it is playoff night.
  return earliest(tournaments) <= earliest(games);
}

// An identity user needs no season check at all. refreshMyTeams() in
// app.js has already recomputed their active leagues from
// people/{userId}.json -- a rollover is not detected here, it simply
// already happened. So resolveSeason's roster voting, and the
// confirmation screen it exists to ask for, never run.
async function routeIdentity(rec) {
  const q = encodeURIComponent;
  const teams = rec.teams ?? [];

  // No active league. NOT a dead pointer: a person does not expire the way
  // a {programId, teamId} pair does, and wiping the identity to "fix" a
  // state that resolves itself on the archiver's next run would throw away
  // exactly what makes next season automatic.
  if (teams.length === 0) {
    location.replace('season.html');
    return;
  }

  // Which league's screen? The one holding the player's next game, found
  // across all of them -- so a player whose Monday season has finished but
  // whose Thursday season is live lands on Thursday without touching
  // anything.
  const schedules = new Map(await Promise.all(
    [...new Set(teams.map((t) => t.programId))].map(async (pid) => {
      let schedule = null;
      try {
        schedule = await fetchJSON(`data/schedule/${pid}.json`);
      } catch (err) {
        console.error('router: schedule fetch failed for program', pid, err);
      }
      return [pid, schedule];
    }),
  ));

  const today = todayISO();
  let best = null;
  for (const team of teams) {
    const games = (schedules.get(team.programId)?.games ?? [])
      .filter((g) => g.date >= today && g.teams.some((t) => t.teamId === Number(team.teamId)));
    for (const g of games) {
      if (best === null || g.date < best.date) best = { date: g.date, team };
    }
  }

  // Nothing upcoming anywhere, but the leagues are live -- between
  // seasons' schedules, or a week off. gamenight.html owns that state, on
  // the primary league.
  const target = best?.team ?? rec.primary ?? teams[0];

  // The playoff decision stays per-league, applied to whichever league the
  // next game is in: a playoff night in one league says nothing about the
  // other.
  const page = isPlayoffNight(schedules.get(target.programId), today) ? 'playoffs' : 'gamenight';
  location.replace(`${page}.html?program=${q(target.programId)}&team=${q(target.teamId)}`);
}

async function route(saved) {
  const q = encodeURIComponent;
  const programId = saved.programId;
  const teamId = saved.teamId;
  const to = (page) => `${page}.html?program=${q(programId)}&team=${q(teamId)}`;

  // Is the saved team even on a season that is still happening? This has
  // to come FIRST, before any of the schedule reasoning below, because
  // every input that reasoning uses survives the end of a season: the
  // archiver keeps rewriting docs/data/standings/{programId}.json for
  // completed programs, and schedule/{programId}.json simply stops being
  // updated, leaving a permanently empty `games` list. So a dead pointer
  // reads as a perfectly healthy program with nothing on tonight, and the
  // player sits on "No game scheduled right now" forever while their real
  // new season plays out under a different program id.
  //
  // Only the redirect is decided here; season.html owns everything about
  // what to offer, for the same reason gamenight.html owns its own
  // no-data states -- one screen per decision, so no recovery path ends
  // up half-implemented in two places.
  //
  // A failure here must never strand anyone: resolveSeason returns
  // 'unknown' when there is no programs index (a deploy older than that
  // file), and a thrown fetch falls through to the normal route.
  try {
    const season = await resolveSeason(saved);
    if (season.status !== 'current' && season.status !== 'unknown') {
      location.replace('season.html');
      return;
    }
  } catch (err) {
    console.error('router: season check failed, staying on the saved team', err);
  }

  // A schedule fetch that fails outright must not strand the player on a
  // permanent "Loading…" -- gamenight.html is the safe default, and it
  // has its own no-data and dead-pointer states.
  let schedule = null;
  try {
    schedule = await fetchJSON(`data/schedule/${programId}.json`);
  } catch (err) {
    console.error('router: schedule fetch failed, defaulting to game night', err);
  }

  location.replace(isPlayoffNight(schedule, todayISO()) ? to('playoffs') : to('gamenight'));
}
</script>
</body>
</html>
