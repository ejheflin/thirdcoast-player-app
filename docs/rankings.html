<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Power Rankings — Third Coast Intel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3C Intel">
<meta name="theme-color" content="#101A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <div><div class="greet" id="greet"></div><div class="brand">Power <em>Rankings</em></div></div>
  </div>
  <div class="body">
    <div class="sec-lbl">Regular season</div>
    <div class="card" id="rows"></div>
  </div>
  <div class="tabbar">
    <div class="tab" data-tab="home"><div class="dot"><svg class="icon"><use href="#i-home"/></svg></div>Home</div>
    <div class="tab" data-tab="ranks"><div class="dot"><svg class="icon"><use href="#i-bars"/></svg></div>Ranks</div>
    <div class="tab" data-tab="schedule"><div class="dot"><svg class="icon"><use href="#i-calendar"/></svg></div>Schedule</div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
const programId = new URLSearchParams(location.search).get('program');
wireTabs({ active: 'ranks', programId });

fetchJSON(`data/standings/${programId}.json`).then((data) => {
  const rowsEl = document.getElementById('rows');
  if (!data || data.rows.length === 0) {
    rowsEl.innerHTML = '<p style="color:var(--app-faint);font-size:13px">No standings yet.</p>';
    return;
  }
  document.getElementById('greet').textContent = data.programName;
  // Every row drills down to its Team Page, the navigation model the spec
  // describes ("Team Page reached from Rankings").
  rowsEl.innerHTML = data.rows.map((r) => `
    <a class="row-link" href="team.html?team=${encodeURIComponent(r.teamId)}&program=${encodeURIComponent(programId)}">
      <div class="rank-row">
        <div class="pos">${r.position}</div>
        <div class="nm"><b>${escapeHTML(displayTeamName(r.teamName))}</b></div>
        <div class="rec">${r.wins}-${r.losses}-${r.ties}</div>
      </div>
    </a>`).join('');
});
</script>
</body>
</html>
