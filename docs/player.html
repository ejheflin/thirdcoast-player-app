<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Player Card — Third Coast Intel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="icon" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3CVB">
<meta name="theme-color" content="#101A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar"><div><div class="greet">Player</div><div class="brand">Player <em style="color:var(--app-data)">Card</em></div></div></div>
  <div class="body" id="body"><p style="color:var(--app-faint);font-size:13px">Loading…</p></div>
  <div class="tabbar">
    <div class="tab" data-tab="home"><div class="dot"><svg class="icon"><use href="#i-home"/></svg></div>Home</div>
    <div class="tab" data-tab="ranks"><div class="dot"><svg class="icon"><use href="#i-bars"/></svg></div>Ranks</div>
    <div class="tab" data-tab="schedule"><div class="dot"><svg class="icon"><use href="#i-calendar"/></svg></div>Schedule</div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
const userId = new URLSearchParams(location.search).get('person');
// Ranks and Schedule fall back to the saved team, so a player card reached
// from anywhere still gets you back into your own league in one tap. No tab
// is "active" here -- there's no Players tab any more.
wireTabs({ active: null, personId: userId });

fetchJSON(`data/people/${userId}.json`).then((person) => {
  const bodyEl = document.getElementById('body');
  if (!person) {
    bodyEl.innerHTML = '<p style="color:var(--app-faint);font-size:13px">We don\'t have a card for this player yet.</p>';
    return;
  }
  const seasons = person.appearances.length;
  const captainCount = person.appearances.filter((a) => a.isCaptain).length;
  bodyEl.innerHTML = `
    <div class="dyn-hero">
      <div class="av"><b>${escapeHTML(person.firstName.slice(0, 2).toUpperCase())}</b></div>
      <h3>${escapeHTML(person.firstName)}</h3>
      <div class="sub">${seasons} season${seasons === 1 ? '' : 's'}</div>
      <div class="badge-row"><span class="badge"><svg class="icon"><use href="#i-star"/></svg> ${captainCount} team${captainCount === 1 ? '' : 's'} captained</span></div>
    </div>
    <div class="sec-lbl">Teams, every season</div>
    <div class="card" style="padding:4px 12px">
      ${person.appearances.map((a) => `<div class="partner-row"><span>${escapeHTML(displayTeamName(a.teamName))}</span><span>${a.isCaptain ? 'Captain' : ''}</span></div>`).join('')}
    </div>
  `;
});
</script>
</body>
</html>
