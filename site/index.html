<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Your Team — Third Coast Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  .search-wrap{padding:60px 20px}
  .search-wrap h1{font-family:"Archivo Black",Impact,sans-serif;font-size:26px;margin:0 0 6px}
  .search-wrap p{color:var(--app-dim);font-size:14px;margin:0 0 20px}
  #q{width:100%;padding:14px;border-radius:12px;border:1px solid var(--app-line);
    background:var(--app-surface);color:var(--app-ink);font-size:16px;font-family:inherit}
  .result{display:block;width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:12px;
    background:var(--app-surface);border:1px solid var(--app-line);color:var(--app-ink);cursor:pointer;font-size:14px}
  .result b{display:block}
  .result span{font-size:12px;color:var(--app-faint)}
  .empty{color:var(--app-faint);font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="screen">
  <div class="search-wrap">
    <h1>Find your team</h1>
    <p>Search this season's active leagues only.</p>
    <input id="q" type="text" placeholder="Team name…" autocomplete="off">
    <div id="results"></div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
let index = [];
fetchJSON('data/active-teams-index.json').then((data) => { index = data ?? []; });

document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const results = document.getElementById('results');
  results.innerHTML = '';
  if (!q) return;
  const matches = index.filter((t) => t.teamName.toLowerCase().includes(q)).slice(0, 15);
  if (matches.length === 0) {
    results.innerHTML = '<p class="empty">Not found yet — if your league just started, check back after the archiver\'s next run.</p>';
    return;
  }
  for (const m of matches) {
    const btn = document.createElement('button');
    btn.className = 'result';
    btn.innerHTML = `<b>${m.teamName}</b><span>${m.programName}</span>`;
    btn.addEventListener('click', () => {
      setMyTeam(m);
      location.href = `team.html?team=${m.teamId}&program=${m.programId}`;
    });
    results.appendChild(btn);
  }
});

// Returning player: skip the search entirely.
const existing = getMyTeam();
if (existing) location.href = `team.html?team=${existing.teamId}&program=${existing.programId}`;
</script>
</body>
</html>
